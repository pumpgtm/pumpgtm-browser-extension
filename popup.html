<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PumpGTM</title>
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #111; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; }
  input, select, button { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 12px; background: #111; color: #fff; border: 0; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .url { font-size: 12px; word-break: break-all; background: #f4f4f4; padding: 8px; border-radius: 6px; }
  .link { background: none; color: #555; padding: 0; margin-top: 12px; text-decoration: underline; font-size: 12px; width: auto; }
  #status { margin-top: 12px; font-size: 13px; }
  .error { color: #b00020; }
  .ok { color: #0a7a2f; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="icons/icon-32.png" alt="">PumpGTM</header>

<section id="settings" hidden>
  <label for="key">Workspace key</label>
  <input id="key" type="password" placeholder="eve_mcp_..." autocomplete="off">
  <button id="saveKey">Save key</button>
</section>

<section id="add" hidden>
  <label>LinkedIn profile</label>
  <div id="profileUrl" class="url"></div>
  <label for="sequence">Sequence</label>
  <select id="sequence"></select>
  <button id="addLead">Add to sequence</button>
  <button id="changeKey" class="link">Change workspace key</button>
</section>

<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
